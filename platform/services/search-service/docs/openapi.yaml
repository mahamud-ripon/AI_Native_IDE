openapi: 3.0.3
info:
  title: Search Service API
  description: |
    Code and project search for AI-Native IDE Platform.
    
    ## Features
    - Full-text code search with Elasticsearch
    - Project discovery
    - File search with syntax highlighting
  version: 1.0.0

servers:
  - url: http://localhost:8008
    description: Local development
  - url: https://api.platform.io
    description: Production

tags:
  - name: Search
    description: Search endpoints

paths:
  /api/v1/search/code:
    get:
      summary: Search code
      description: Search code across projects
      tags:
        - Search
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          example: function add
        - name: projectId
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/CodeSearchResult'

  /api/v1/search/projects:
    get:
      summary: Search projects
      description: Search public projects
      tags:
        - Search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Projects list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      projects:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProjectSearchResult'

  /api/v1/health:
    get:
      summary: Service health check
      description: Health check endpoint
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy

components:
  parameters:
    X-API-Version:
      name: X-API-Version
      in: header
      description: API version header for versioning
      required: false
      schema:
        type: string
        default: "1.0"
      example: "1.0"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CodeSearchResult:
      type: object
      properties:
        filePath:
          type: string
        snippet:
          type: string
        projectName:
          type: string
        language:
          type: string

    ProjectSearchResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        stars:
          type: integer
        owner:
          type: string
