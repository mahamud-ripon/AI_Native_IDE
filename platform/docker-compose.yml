version: '3.8'

services:
  # ============================================
  # API GATEWAY
  # ============================================

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: ai-native-api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8000
      AUTH_SERVICE_URL: http://auth-service:3100
      PROJECT_SERVICE_URL: http://project-service:8002
      AI_SERVICE_URL: http://ai-service:8003
      EXECUTION_SERVICE_URL: http://execution-service:8004
      COLLAB_SERVICE_URL: http://collab-service:8005
      BILLING_SERVICE_URL: http://billing-service:8006
      NOTIFICATION_SERVICE_URL: http://notification-service:8007
      SEARCH_SERVICE_URL: http://search-service:8008
      STORAGE_SERVICE_URL: http://storage-service:8009
      DEPLOYMENT_SERVICE_URL: http://deployment-service:8010
      ANALYTICS_SERVICE_URL: http://analytics-service:8011
      WEBSOCKET_GATEWAY_URL: http://websocket-gateway:8012
      PYTHON_AGENTS_URL: http://python-agents:9000
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100

  # ============================================
  # WEBSOCKET GATEWAY
  # ============================================

  websocket-gateway:
    build:
      context: .
      dockerfile: services/websocket-gateway/Dockerfile
    container_name: ai-native-ws-gateway
    restart: unless-stopped
    ports:
      - "8012:8012"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8012
      API_GATEWAY_URL: http://api-gateway:8000

  # ============================================
  # MICROSERVICES
  # ============================================

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: ai-native-auth-service
    restart: unless-stopped
    ports:
      - "3100:3100"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3100
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}

  project-service:
    build:
      context: .
      dockerfile: services/project-service/Dockerfile
    container_name: ai-native-project-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8002

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    container_name: ai-native-ai-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8003
      AI_AGENTS_URL: http://python-agents:9000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}

  python-agents:
    build:
      context: ./ai-agents
      dockerfile: Dockerfile.dev
    container_name: ai-native-python-agents
    restart: unless-stopped
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: '1'
      PORT: 9000
      PROJECT_SERVICE_URL: http://project-service:8002
      STORAGE_SERVICE_URL: http://storage-service:8009
    volumes:
      - ./ai-agents:/app
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 9000 --reload

  billing-service:
    build:
      context: .
      dockerfile: services/billing-service/Dockerfile
    container_name: ai-native-billing-service
    restart: unless-stopped
    ports:
      - "8006:8006"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8006
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
    volumes:
      - ./services/billing-service:/app
      - /app/node_modules

  collab-service:
    build:
      context: .
      dockerfile: services/collab-service/Dockerfile
    container_name: ai-native-collab-service
    restart: unless-stopped
    ports:
      - "8005:8005"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8005
      KAFKA_GROUP_ID: collab-service
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      MAX_CACHED_DOCS: ${MAX_CACHED_DOCS:-100}
    volumes:
      - ./services/collab-service:/app
      - /app/node_modules

  deployment-service:
    build:
      context: .
      dockerfile: services/deployment-service/Dockerfile
    container_name: ai-native-deployment-service
    restart: unless-stopped
    ports:
      - "8010:8010"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8010
      KAFKA_GROUP_ID: deployment-service
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      VERCEL_TOKEN: ${VERCEL_TOKEN:-}
      RAILWAY_TOKEN: ${RAILWAY_TOKEN:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./services/deployment-service:/app
      - /app/node_modules

  execution-service:
    build:
      context: .
      dockerfile: services/execution-service/Dockerfile
    container_name: ai-native-execution-service
    restart: unless-stopped
    ports:
      - "8004:8004"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8004
      KAFKA_GROUP_ID: execution-service
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      FIRECRACKER_BINARY: ${FIRECRACKER_BINARY:-/usr/local/bin/firecracker}
      JAILER_BINARY: ${JAILER_BINARY:-/usr/local/bin/jailer}

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: ai-native-notification-service
    restart: unless-stopped
    ports:
      - "8007:8007"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8007
      KAFKA_GROUP_ID: notification-service
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-noreply@platform.io}
    volumes:
      - ./services/notification-service:/app
      - /app/node_modules

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    container_name: ai-native-analytics-service
    restart: unless-stopped
    ports:
      - "8011:8011"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8011
    volumes:
      - ./services/analytics-service:/app
      - /app/node_modules

  search-service:
    build:
      context: .
      dockerfile: services/search-service/Dockerfile
    container_name: ai-native-search-service
    restart: unless-stopped
    ports:
      - "8008:8008"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8008
    volumes:
      - ./services/search-service:/app
      - /app/node_modules

  storage-service:
    build:
      context: .
      dockerfile: services/storage-service/Dockerfile
    container_name: ai-native-storage-service
    restart: unless-stopped
    ports:
      - "8009:8009"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8009
    volumes:
      - ./services/storage-service:/app
      - /app/node_modules

  # ============================================
  # FRONTEND
  # ============================================

  ide:
    build:
      context: .
      dockerfile: apps/ide/Dockerfile
    container_name: ai-native-ide
    restart: unless-stopped
    ports:
      - "5173:80"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8012

  # ============================================
  # WORKERS
  # ============================================

  background-worker:
    build:
      context: .
      dockerfile: services/background-worker/Dockerfile
    container_name: ai-native-background-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - ./services/background-worker:/app
      - /app/node_modules

networks:
  default:
    name: ai-native-network