version: '3.8'

services:
  # ============================================
  # DATABASE & CACHE
  # ============================================
  
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ai-native-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ainative}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ainative_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ainative_ide}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ainative}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-native-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # MESSAGING
  # ============================================
  
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ai-native-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ai-native-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  # ============================================
  # API GATEWAY
  # ============================================

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: ai-native-api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8000
      POSTGRES_URL: postgres://${POSTGRES_USER:-ainative}:${POSTGRES_PASSWORD:-ainative_pass}@postgres:5432/${POSTGRES_DB:-ainative_ide}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  # ============================================
  # WEBSOCKET GATEWAY
  # ============================================

  websocket-gateway:
    build:
      context: .
      dockerfile: services/websocket-gateway/Dockerfile
    container_name: ai-native-ws-gateway
    restart: unless-stopped
    ports:
      - "8012:8012"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8012
      POSTGRES_URL: postgres://${POSTGRES_USER:-ainative}:${POSTGRES_PASSWORD:-ainative_pass}@postgres:5432/${POSTGRES_DB:-ainative_ide}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      API_GATEWAY_URL: http://api-gateway:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================
  # MICROSERVICES
  # ============================================

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: ai-native-auth-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8002
      POSTGRES_URL: postgres://${POSTGRES_USER:-ainative}:${POSTGRES_PASSWORD:-ainative_pass}@postgres:5432/${POSTGRES_DB:-ainative_ide}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  project-service:
    build:
      context: .
      dockerfile: services/project-service/Dockerfile
    container_name: ai-native-project-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8003
      POSTGRES_URL: postgres://${POSTGRES_USER:-ainative}:${POSTGRES_PASSWORD:-ainative_pass}@postgres:5432/${POSTGRES_DB:-ainative_ide}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    container_name: ai-native-ai-service
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8005
      POSTGRES_URL: postgres://${POSTGRES_USER:-ainative}:${POSTGRES_PASSWORD:-ainative_pass}@postgres:5432/${POSTGRES_DB:-ainative_ide}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  billing-service:
    build:
      context: .
      dockerfile: services/billing-service/Dockerfile
    container_name: ai-native-billing-service
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8006
      DATABASE_URL: postgres://${POSTGRES_USER:-ainative}:${POSTGRES_PASSWORD:-ainative_pass}@postgres:5432/${POSTGRES_DB:-ainative_ide}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./services/billing-service:/app
      - /app/node_modules

  collab-service:
    build:
      context: .
      dockerfile: services/collab-service/Dockerfile
    container_name: ai-native-collab-service
    restart: unless-stopped
    ports:
      - "8008:8008"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8008
      DATABASE_URL: postgres://${POSTGRES_USER:-ainative}:${POSTGRES_PASSWORD:-ainative_pass}@postgres:5432/${POSTGRES_DB:-ainative_ide}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: collab-service
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      MAX_CACHED_DOCS: ${MAX_CACHED_DOCS:-100}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./services/collab-service:/app
      - /app/node_modules

  deployment-service:
    build:
      context: .
      dockerfile: services/deployment-service/Dockerfile
    container_name: ai-native-deployment-service
    restart: unless-stopped
    ports:
      - "8011:8011"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8011
      DATABASE_URL: postgres://${POSTGRES_USER:-ainative}:${POSTGRES_PASSWORD:-ainative_pass}@postgres:5432/${POSTGRES_DB:-ainative_ide}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: deployment-service
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      VERCEL_TOKEN: ${VERCEL_TOKEN:-}
      RAILWAY_TOKEN: ${RAILWAY_TOKEN:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./services/deployment-service:/app
      - /app/node_modules

  execution-service:
    build:
      context: .
      dockerfile: services/execution-service/Dockerfile
    container_name: ai-native-execution-service
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8004
      DATABASE_URL: postgres://${POSTGRES_USER:-ainative}:${POSTGRES_PASSWORD:-ainative_pass}@postgres:5432/${POSTGRES_DB:-ainative_ide}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: execution-service
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      FIRECRACKER_BINARY: ${FIRECRACKER_BINARY:-/usr/local/bin/firecracker}
      JAILER_BINARY: ${JAILER_BINARY:-/usr/local/bin/jailer}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./services/execution-service:/app
      - /app/node_modules
    privileged: true

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: ai-native-notification-service
    restart: unless-stopped
    ports:
      - "8007:8007"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8007
      DATABASE_URL: postgres://${POSTGRES_USER:-ainative}:${POSTGRES_PASSWORD:-ainative_pass}@postgres:5432/${POSTGRES_DB:-ainative_ide}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: notification-service
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-noreply@platform.io}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./services/notification-service:/app
      - /app/node_modules

  # ============================================
  # FRONTEND
  # ============================================

  ide:
    build:
      context: .
      dockerfile: apps/ide/Dockerfile
    container_name: ai-native-ide
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8001
    depends_on:
      - api-gateway
      - websocket-gateway
    volumes:
      - ./apps/ide:/app
      - /app/node_modules
      - /app/.next

  # ============================================
  # WORKERS
  # ============================================

  background-worker:
    build:
      context: .
      dockerfile: services/background-worker/Dockerfile
    container_name: ai-native-background-worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      POSTGRES_URL: postgres://${POSTGRES_USER:-ainative}:${POSTGRES_PASSWORD:-ainative_pass}@postgres:5432/${POSTGRES_DB:-ainative_ide}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./services/background-worker:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  zookeeper_data:

networks:
  default:
    name: ai-native-network