services:
  # ============================================
  # INFRASTRUCTURE
  # ============================================

  postgres:
    image: pgvector/pgvector:pg15
    container_name: ai-native-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ainative}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ainative_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ainative_ide}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ainative} -d ${POSTGRES_DB:-ainative_ide}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-native-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ai-native-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ai-native-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  minio:
    image: minio/minio
    container_name: ai-native-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # ============================================
  # SETUP (Install dependencies once)
  # ============================================

  setup:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-native-setup
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: pnpm install

  # ============================================
  # BACKEND SERVICES
  # ============================================

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-native-api-gateway
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: pnpm --filter @ai-ide/api-gateway dev
    ports:
      - "8000:8000"
    env_file: .env.docker
    environment:
      PORT: 8000
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  websocket-gateway:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-native-ws-gateway
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: pnpm --filter @ai-ide/websocket-gateway dev
    ports:
      - "8012:8012"
    env_file: .env.docker
    environment:
      PORT: 8012
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-native-auth-service
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: pnpm --filter @ai-ide/auth-service dev
    ports:
      - "8002:8002"
    env_file: .env.docker
    environment:
      PORT: 8002
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  project-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-native-project-service
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: pnpm --filter @ai-ide/project-service dev
    ports:
      - "8003:8003"
    env_file: .env.docker
    environment:
      PORT: 8003
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  execution-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-native-execution-service
    privileged: true
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: pnpm --filter @ai-ide/execution-service dev
    ports:
      - "8004:8004"
    env_file: .env.docker
    environment:
      PORT: 8004
    depends_on:
      setup:
        condition: service_completed_successfully

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-native-ai-service
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: pnpm --filter @ai-ide/ai-service dev
    ports:
      - "8005:8005"
    env_file: .env.docker
    environment:
      PORT: 8005
    depends_on:
      setup:
        condition: service_completed_successfully

  collab-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-native-collab-service
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: pnpm --filter @ai-ide/collab-service dev
    ports:
      - "8008:8008"
    env_file: .env.docker
    environment:
      PORT: 8008
    depends_on:
      setup:
        condition: service_completed_successfully

  storage-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-native-storage-service
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: pnpm --filter @ai-ide/storage-service dev
    ports:
      - "8009:8009"
    env_file: .env.docker
    environment:
      PORT: 8009
    depends_on:
      setup:
        condition: service_completed_successfully
      minio:
        condition: service_started

  # ============================================
  # AI SERVICES
  # ============================================

  ai-agents:
    build:
      context: ./ai-agents
      dockerfile: Dockerfile.dev
    container_name: ai-native-python-agents
    restart: unless-stopped
    ports:
      - "9000:9000"
    env_file:
      - ./ai-agents/.env
      - .env
    environment:
      PORT: 9000
      DEBUG: "true"
      GROQ_API_KEY: ${GROQ_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - redis
      - kafka
    networks:
      - default

  # ============================================
  # FRONTEND APPS
  # ============================================

  ide:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-native-ide
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: pnpm --filter ide-client dev -- --host
    ports:
      - "3000:5173"
    env_file: .env.docker
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8001
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  minio_data:
  node_modules:

networks:
  default:
    name: ai-native-dev-network
