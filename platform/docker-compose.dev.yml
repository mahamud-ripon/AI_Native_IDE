services:
  # ============================================
  # INFRASTRUCTURE
  # ============================================

  # services:
  # services:
  #   postgres:
  #     image: pgvector/pgvector:pg15
  #     # ... rest of postgres config
    
  #   redis:
  #     image: redis:7-alpine
  #     # ... rest of redis config
    
  #   zookeeper:
  #     image: confluentinc/cp-zookeeper:7.5.0
  #     # ... rest of zookeeper config
    
  #   kafka:
  #     image: confluentinc/cp-kafka:7.5.0
  #     # ... rest of kafka config

  minio:
    image: minio/minio
    container_name: ai-native-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # ============================================
  # SETUP (Install dependencies once)
  # ============================================

  setup:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-native-setup
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: pnpm install

  # ============================================
  # BACKEND SERVICES
  # ============================================

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-native-api-gateway
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: pnpm --filter @ai-ide/api-gateway dev
    ports:
      - "8000:8000"
    env_file: .env.docker
    environment:
      PORT: 8000
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  websocket-gateway:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-native-ws-gateway
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: pnpm --filter @ai-ide/websocket-gateway dev
    ports:
      - "8012:8012"
    env_file: .env.docker
    environment:
      PORT: 8012
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-native-auth-service
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: pnpm --filter @ai-ide/auth-service dev
    ports:
      - "3100:3100"
    env_file: .env.docker
    environment:
      PORT: 3100
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  project-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-native-project-service
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: pnpm --filter @ai-ide/project-service dev
    ports:
      - "8002:8002"
    env_file: .env.docker
    environment:
      PORT: 8002
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  execution-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-native-execution-service
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: pnpm --filter @ai-ide/execution-service dev
    ports:
      - "8004:8004"
    env_file: .env.docker
    environment:
      PORT: 8004
    depends_on:
      setup:
        condition: service_completed_successfully

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-native-ai-service
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: pnpm --filter @ai-ide/ai-service dev
    ports:
      - "8003:8003"
    env_file: .env.docker
    environment:
      PORT: 8003
    depends_on:
      setup:
        condition: service_completed_successfully

  collab-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-native-collab-service
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: pnpm --filter @ai-ide/collab-service dev
    ports:
      - "8005:8005"
    env_file: .env.docker
    environment:
      PORT: 8005
    depends_on:
      setup:
        condition: service_completed_successfully

  storage-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-native-storage-service
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: pnpm --filter @ai-ide/storage-service dev
    ports:
      - "8009:8009"
    env_file: .env.docker
    environment:
      PORT: 8009
    depends_on:
      setup:
        condition: service_completed_successfully
      minio:
        condition: service_started

  # ============================================
  # AI SERVICES
  # ============================================

  ai-agents:
    build:
      context: ./ai-agents
      dockerfile: Dockerfile.dev
    container_name: ai-native-python-agents
    restart: unless-stopped
    ports:
      - "9002:9000"
    env_file:
      - ./ai-agents/.env
      - .env
    environment:
      PORT: 9000
      DEBUG: "true"
      GROQ_API_KEY: ${GROQ_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - redis
      - kafka
    networks:
      - default

  # ============================================
  # FRONTEND APPS
  # ============================================

  ide:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-native-ide
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: pnpm --filter ide-client dev -- --host
    ports:
      - "5173:5173"
    env_file: .env.docker
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8012
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  minio_data:
  node_modules:

networks:
  default:
    name: ai-native-dev-network
